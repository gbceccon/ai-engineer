[project]
name = "ai-engineer"
version = "0.0.1"
description = "12-month AI engineering journey: evolving OpenPilot project (incident triage copilot for Open Finance)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Grow these as phases unlock: ph3 torch/transformers,
# ph4 llm-api/chromadb, ph5 langgraph/peft/trl, ph6 fastapi/docker
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
]

[tool.ruff]
line-length = 100
src = ["openpilot", "tests"]
extend-exclude = ["scripts"]  # one-off utility scripts (CV builder etc.)

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["openpilot"]
